version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: gnn_traffic_backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=True
      - DATABASE_URL=sqlite:///./encrypted_traffic.db
      - MODEL_TYPE=GraphSAGE
    volumes:
      - ./backend/app/ml/saved_models:/app/app/ml/saved_models
    restart: always

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: gnn_traffic_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
      - REACT_APP_WS_URL=ws://localhost:8000/api/ws
    restart: always
