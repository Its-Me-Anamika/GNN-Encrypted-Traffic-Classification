dataset:
  name: "ISCX VPN-nonVPN"
  dataset_url: "https://www.unb.ca/cic/datasets/vpn.html"
  num_features: 28
  num_classes: 9
  classes:
    - Streaming
    - Chat
    - VoIP
    - File Transfer
    - Browsing
    - P2P
    - Email
    - VPN
    - Unknown
  splits:
    train: 0.70
    val: 0.15
    test: 0.15

gnn_model:
  architecture: "GraphSAGE" # "GraphSAGE" or "GAT"
  in_channels: 28
  hidden_channels: 128
  out_channels: 9
  num_layers: 3
  dropout_rate: 0.3
  mc_dropout_samples: 20
  confidence_threshold: 0.65

training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "Adam"
  scheduler: "ReduceLROnPlateau"
  save_dir: "backend/app/ml/saved_models"
